<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voice Survey · 架空のワークショップ</title><link rel="stylesheet" href="/style.css"></head>
<body><header><a href="#main" class="skip">本文へ移動</a><p class="brand">VOICE SURVEY</p><p id="mode">デモを準備しています</p></header>
<main id="main"><div class="intro"><h1>話して整理し、<br>自分で決める。</h1><p>架空の図書室ワークショップを題材に、会話から回答候補を作る流れを試せます。候補は確認してから確定できます。</p></div>
<section id="fixtures" class="fixtures"><h2>架空の会話を試す</h2><div class="buttons"><button id="replay">この質問の発言例</button><button id="explain">説明を頼む例</button><button id="correction">希望を訂正する例</button><button id="unknown">判断を見送る例</button><button id="material">資料を映す例</button></div><p>台本にある会話を再生するデモです。実際の音声や映像は使いません。</p><p id="feedback" aria-live="polite"></p></section>
<div id="survey"></div><section class="host"><h2>組み込み先のフォーム</h2><p id="host-status" aria-live="polite">AI候補の段階では、このフォームに回答は入りません。</p>
<form id="host-form"><label>参加する時間<select name="schedule"><option value="">未確定</option><option value="weekday">平日の夕方</option><option value="weekend">週末の昼間</option><option value="either">どちらでも</option></select></label><fieldset><legend>制作</legend><label><input type="checkbox" name="activities" value="paper">紙の工作</label><label><input type="checkbox" name="activities" value="stories">短い物語を書く</label><label><input type="checkbox" name="activities" value="drawing">絵を描く</label></fieldset><label>ペース<input name="pace" type="number" min="1" max="5"></label><label>ほかのアイデア<textarea name="idea"></textarea></label><button>フォームの動きを確認（送信なし）</button></form></section></main><footer>架空データだけのデモ · 回答や会話は再読み込みで消えます</footer><script type="module" src="/bundle.js"></script></body></html>
